name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches: [feat/mobile-web-pages, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true
      - name: Add web platform
        working-directory: mobile
        run: flutter create . --platforms web --project-name gieokhaejwo
      - name: Build web
        working-directory: mobile
        run: |
          flutter pub get
          flutter build web --release --base-href /missing-alert-care/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
